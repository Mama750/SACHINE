<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1E5B3A">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<title>चन्द्रकला कृषि केंद्र - स्टॉक रजिस्टर</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Mukta:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{
  --leaf:#1E5B3A; --leaf-dark:#154530; --leaf-soft:#E1EEDF;
  --seed:#E0A526; --seed-ink:#3A2A00;
  --bg:#F2F5EC; --surface:#FFFFFF; --surface-2:#F7F9F3;
  --ink:#2B2118; --muted:#6B6558; --line:#DCE3D1;
  --bad:#B42318; --bad-soft:#FBE9E6; --warn:#9A5B00; --warn-soft:#FFF1D6; --good:#1E7B45; --good-soft:#E2F3E8;
  --shadow:0 -8px 30px rgba(20,40,25,.18);
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --leaf:#2F8A58; --leaf-dark:#0F2A1B; --leaf-soft:#1E3326;
    --seed:#E8B33A; --seed-ink:#2A1E00;
    --bg:#0F1711; --surface:#18231B; --surface-2:#1F2C22;
    --ink:#E9F0E6; --muted:#9DAA9B; --line:#2B3A2F;
    --bad:#FF8A7A; --bad-soft:#3A1C18; --warn:#F2B654; --warn-soft:#33260E; --good:#6FD39A; --good-soft:#18331F;
    --shadow:0 -8px 30px rgba(0,0,0,.5);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --leaf:#2F8A58; --leaf-dark:#0F2A1B; --leaf-soft:#1E3326;
  --seed:#E8B33A; --seed-ink:#2A1E00;
  --bg:#0F1711; --surface:#18231B; --surface-2:#1F2C22;
  --ink:#E9F0E6; --muted:#9DAA9B; --line:#2B3A2F;
  --bad:#FF8A7A; --bad-soft:#3A1C18; --warn:#F2B654; --warn-soft:#33260E; --good:#6FD39A; --good-soft:#18331F;
  --shadow:0 -8px 30px rgba(0,0,0,.5);
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{background:var(--leaf-dark);scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Mukta','Noto Sans Devanagari','Nirmala UI',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:16px;line-height:1.35;min-height:100vh;overflow-x:hidden}
body.noscroll{overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
:focus-visible{outline:3px solid var(--seed);outline-offset:2px}
.en{display:block;font-size:.72em;font-weight:400;opacity:.78;line-height:1.1;margin-top:1px}
svg.ic{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--leaf);color:#fff;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 14px;border-bottom:4px solid var(--seed)}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.logo{width:48px;height:48px;border-radius:12px;background:#FBF8EE;overflow:hidden;flex:none;border:2px solid var(--seed)}
.logo img{width:100%;height:100%;object-fit:cover;display:block}
.shopcard{display:flex;gap:14px;align-items:center;background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:12px;margin-top:20px}
.shopcard img{width:76px;height:76px;border-radius:12px;object-fit:cover;flex:none;background:#FBF8EE}
.shopcard b{font-size:17px;display:block}
.shopcard a{display:inline-block;margin-top:4px;color:var(--leaf);font-weight:700;text-decoration:none;min-height:32px}
.top h1{margin:0;font-size:20px;font-weight:800;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top p{margin:1px 0 0;font-size:12.5px;opacity:.85}
.top-actions{display:flex;gap:6px;flex:none}
.top-actions button{min-width:44px;height:44px;border-radius:12px;background:rgba(255,255,255,.14);color:#fff;display:grid;place-items:center;font-weight:600;font-size:13px;padding:0 8px}

main{max-width:600px;margin:0 auto;padding:14px 14px 120px}
h2{font-size:18px;font-weight:800;margin:20px 0 8px}
h3{font-size:19px;font-weight:800;margin:4px 0 12px}
.muted{color:var(--muted)}
.sp{display:flex;align-items:center;justify-content:space-between;gap:8px}

/* hero */
.hero{background:var(--leaf);color:#fff;border-radius:18px;padding:18px 18px 16px;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-20px;bottom:-26px;width:150px;height:110px;opacity:.16;background:
  repeating-linear-gradient(115deg,transparent 0 10px,#fff 10px 12px);border-radius:60px 0 0 0}
.hero-lbl{font-size:14px;opacity:.9}
.hero-num{font-size:38px;font-weight:800;line-height:1.1;margin:2px 0 2px;letter-spacing:-.5px}
.hero-sub{font-size:14px;opacity:.9}

.quick{display:grid;grid-template-columns:1.25fr 1fr 1fr;gap:8px;margin:12px 0}
.qbtn{min-height:72px;border-radius:14px;background:var(--surface);border:1.5px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:8px 4px;font-weight:600;font-size:14.5px;text-align:center}
.qbtn.main{background:var(--seed);border-color:var(--seed);color:var(--seed-ink)}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tile{background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:12px;text-align:left;display:block;width:100%}
.tile b{display:block;font-size:24px;font-weight:800;line-height:1.1}
.tile span{font-size:13.5px;color:var(--muted)}
.tile.warn{background:var(--warn-soft);border-color:transparent}.tile.warn b{color:var(--warn)}
.tile.bad{background:var(--bad-soft);border-color:transparent}.tile.bad b{color:var(--bad)}

/* lists */
.list{background:var(--surface);border:1.5px solid var(--line);border-radius:14px;overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:10px 12px;width:100%;text-align:left;border-bottom:1px solid var(--line);background:none}
.row:last-child{border-bottom:0}
.thumb{width:54px;height:54px;border-radius:12px;background:var(--leaf-soft);display:grid;place-items:center;font-size:26px;overflow:hidden;flex:none}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.rmain{flex:1;min-width:0}
.rname{font-weight:600;font-size:16.5px;line-height:1.2;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.rsub{font-size:13px;color:var(--muted);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rqty{text-align:right;flex:none;max-width:42%}
.rqty b{font-size:20px;font-weight:800;display:block;line-height:1.1}
.rqty span{font-size:12.5px;color:var(--muted)}
.chip{display:inline-block;font-size:12px;font-weight:600;padding:1px 8px;border-radius:99px;margin:3px 4px 0 0}
.chip.bad{background:var(--bad-soft);color:var(--bad)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.good{background:var(--good-soft);color:var(--good)}
.pos{color:var(--good)}.neg{color:var(--bad)}
.empty{padding:26px 16px;text-align:center;color:var(--muted)}
.empty .big{font-size:40px}

/* controls */
.search{position:relative}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--muted)}
.search input{padding-left:42px}
input,select,textarea{width:100%;min-height:48px;border:1.5px solid var(--line);border-radius:12px;background:var(--surface);padding:8px 12px;font-size:16px}
textarea{min-height:70px;resize:vertical}
label{display:block;font-size:13.5px;font-weight:600;margin-bottom:4px}
.field{margin-bottom:12px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.chips{display:flex;gap:6px;overflow-x:auto;padding:8px 0 4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.pill{flex:none;min-height:38px;padding:4px 14px;border-radius:99px;background:var(--surface);border:1.5px solid var(--line);font-size:14.5px;font-weight:600;white-space:nowrap}
.pill.on{background:var(--leaf);border-color:var(--leaf);color:#fff}
.btn{min-height:50px;border-radius:13px;padding:6px 16px;font-weight:700;font-size:16.5px;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-align:center}
.btn.primary{background:var(--leaf);color:#fff}
.btn.seed{background:var(--seed);color:var(--seed-ink)}
.btn.ghost{background:var(--surface);border:1.5px solid var(--line)}
.btn.danger{background:var(--bad-soft);color:var(--bad)}
.btn.block{display:flex;width:100%}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0}
.seg{display:grid;grid-template-columns:repeat(3,1fr);border:1.5px solid var(--line);border-radius:12px;overflow:hidden}
.seg button{min-height:46px;font-weight:600;background:var(--surface)}
.seg button.on{background:var(--leaf);color:#fff}
.fab{position:fixed;right:16px;bottom:calc(86px + env(safe-area-inset-bottom,0px));z-index:15;height:56px;border-radius:28px;background:var(--seed);color:var(--seed-ink);padding:0 20px;display:flex;align-items:center;gap:8px;font-weight:800;box-shadow:0 6px 18px rgba(0,0,0,.28)}

/* nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--surface);border-top:1.5px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.nav-in{max-width:600px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);align-items:end;padding:4px 4px 6px}
.nav button{min-height:56px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:12.5px;font-weight:600;color:var(--muted);text-align:center;line-height:1.1}
.nav button.on{color:var(--leaf)}
.nav button .en{font-size:10.5px}
.nav .sale{color:var(--seed-ink)}
.nav .sale i{width:54px;height:54px;border-radius:50%;background:var(--seed);display:grid;place-items:center;margin-top:-26px;border:4px solid var(--surface);box-shadow:0 4px 12px rgba(0,0,0,.25)}
.nav .sale span{color:var(--ink)}

/* sheet / dialog / toast */
.backdrop{position:fixed;inset:0;z-index:40;background:rgba(10,20,12,.55);display:flex;align-items:flex-end;justify-content:center}
.sheet-body h3{padding-right:44px}
.sheet{position:relative;width:100%;max-width:600px;max-height:92vh;max-height:92dvh;background:var(--bg);border-radius:20px 20px 0 0;box-shadow:var(--shadow);display:flex;flex-direction:column;animation:up .22s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}}
.grab{width:42px;height:5px;border-radius:3px;background:var(--line);margin:8px auto 0;flex:none}
.sheet-body{overflow-y:auto;padding:10px 16px calc(20px + env(safe-area-inset-bottom,0px));-webkit-overflow-scrolling:touch}
.sheet-x{position:absolute;right:10px;top:10px;width:40px;height:40px;border-radius:10px;display:grid;place-items:center;color:var(--muted)}
.dlg{position:fixed;inset:0;z-index:60;background:rgba(10,20,12,.6);display:grid;place-items:center;padding:20px}
.dlg-box{background:var(--surface);border-radius:16px;padding:18px;width:100%;max-width:380px}
.dlg-box p{margin:0 0 16px;font-size:17px}
#toast{position:fixed;left:12px;right:12px;bottom:calc(92px + env(safe-area-inset-bottom,0px));z-index:70;display:flex;justify-content:center;pointer-events:none}
.toast{pointer-events:auto;background:#22301F;color:#fff;border-radius:12px;padding:12px 16px;font-weight:600;display:flex;gap:14px;align-items:center;max-width:520px;box-shadow:0 6px 20px rgba(0,0,0,.3)}
.toast button{color:var(--seed);font-weight:800}

/* product sheet */
.pimg{width:100%;aspect-ratio:16/10;border-radius:14px;background:var(--leaf-soft);display:grid;place-items:center;font-size:56px;overflow:hidden;margin-bottom:10px}
.pimg img{width:100%;height:100%;object-fit:cover}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0}
.kv div{background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:8px 10px}
.kv small{display:block;color:var(--muted);font-size:12.5px}
.kv b{font-size:16.5px}
.photo-pick{display:flex;gap:10px;align-items:center;margin-bottom:12px}
.photo-pick .thumb{width:84px;height:84px;font-size:34px}
.photo-pick .btns{margin:0;flex:1;grid-template-columns:1fr}
.photo-pick .btn{min-height:40px;font-size:14.5px}

/* cart */
.line{background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:10px;margin-bottom:8px}
.line-top{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.line-top b{font-weight:600;line-height:1.2}
.line-top button{color:var(--bad);width:36px;height:36px;display:grid;place-items:center;flex:none;margin:-6px -6px 0 0}
.line-row{display:grid;grid-template-columns:1fr 1fr auto;gap:8px;align-items:end;margin-top:6px}
.line-row input{min-height:44px}
.line-row .lt{font-weight:800;min-width:76px;text-align:right;padding-bottom:10px}
.tot{background:var(--leaf-soft);border-radius:12px;padding:10px 12px;margin:10px 0}
.tot div{display:flex;justify-content:space-between;padding:2px 0}
.tot .grand{font-size:21px;font-weight:800}
.results{background:var(--surface);border:1.5px solid var(--line);border-radius:12px;margin:6px 0 10px;overflow:hidden}
.results .row{padding:8px 10px}

/* charts */
.bars{display:flex;align-items:flex-end;gap:8px;height:150px;padding:8px 4px 0;background:var(--surface);border:1.5px solid var(--line);border-radius:14px}
.bar{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;font-size:11.5px;color:var(--muted)}
.bar i{display:block;width:70%;background:var(--leaf);border-radius:6px 6px 0 0;min-height:3px}
.bar.today i{background:var(--seed)}
.bar span{padding:3px 0 5px}
.hb{margin:8px 0}
.hb .t{display:flex;justify-content:space-between;font-size:14.5px}
.hb .tr{height:9px;border-radius:5px;background:var(--leaf-soft);margin-top:3px;overflow:hidden}
.hb .tr i{display:block;height:100%;background:var(--leaf);border-radius:5px}
.banner{background:var(--warn-soft);color:var(--warn);border-radius:12px;padding:10px 12px;margin-bottom:12px;font-weight:600}
.note{font-size:13.5px;color:var(--muted);margin:6px 0}
.fab2{position:fixed;right:16px;bottom:calc(86px + env(safe-area-inset-bottom,0px));z-index:15;height:56px;border-radius:28px;background:var(--leaf);color:#fff;padding:0 18px;display:flex;align-items:center;gap:8px;font-weight:800;box-shadow:0 6px 18px rgba(0,0,0,.28);border:2px solid var(--seed)}
.fab2.up{bottom:calc(152px + env(safe-area-inset-bottom,0px))}
.aibox{background:var(--leaf-soft);border-radius:12px;padding:10px 12px;margin:10px 0}
.ai-note{font-size:13.5px;color:var(--muted);min-height:20px;margin:6px 0}
.pre{white-space:pre-wrap}
.scan-thumbs{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 10px}
.scan-thumbs div{position:relative;width:84px;height:84px;border-radius:12px;overflow:hidden;background:var(--leaf-soft)}
.scan-thumbs img{width:100%;height:100%;object-fit:cover;display:block}
.scan-thumbs button{position:absolute;top:3px;right:3px;width:28px;height:28px;border-radius:50%;background:rgba(0,0,0,.65);color:#fff;display:grid;place-items:center}
.scan-thumbs svg.ic{width:16px;height:16px}
.finding{background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;margin:8px 0}
.finding h4{margin:0 0 4px;font-size:17px;font-weight:800}
.spin{display:inline-block;width:16px;height:16px;border:3px solid var(--line);border-top-color:var(--leaf);border-radius:50%;animation:rot .8s linear infinite;vertical-align:-3px}
@keyframes rot{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation-duration:2.6s}}
</style>
</head>
<body>

<header class="top">
  <div class="brand">
    <div class="logo" id="logo" aria-hidden="true"></div>
    <div><h1 id="shopname">चन्द्रकला कृषि केंद्र</h1><p id="shopsub">स्टॉक रजिस्टर</p></div>
  </div>
  <div class="top-actions">
    <button id="btn-lang" aria-label="भाषा / Language"></button>
    <button data-act="go" data-v="settings" id="btn-set" aria-label="सेटिंग / Settings"></button>
  </div>
</header>

<main id="app"></main>

<nav class="nav" aria-label="मुख्य मेनू">
  <div class="nav-in" id="nav"></div>
</nav>

<div id="layer"></div>
<div id="dlg"></div>
<div id="toast" aria-live="polite"></div>

<script>
(function(){

/* ---------- storage (IndexedDB, with graceful fallback) ---------- */
const STORES=['products','bills','ins','adjs','pays','photos','people','meta'];
let idb=null;
function openDB(){return new Promise(res=>{try{
  const r=indexedDB.open('chandrakala-krishi-kendra',1);
  r.onupgradeneeded=()=>{STORES.forEach(s=>{if(!r.result.objectStoreNames.contains(s))r.result.createObjectStore(s,{keyPath:'id'})})};
  r.onsuccess=()=>res(r.result);r.onerror=()=>res(null);r.onblocked=()=>res(null);
}catch(e){res(null)}})}
function dbAll(s){return new Promise(res=>{if(!idb)return res([]);try{const q=idb.transaction(s).objectStore(s).getAll();q.onsuccess=()=>res(q.result||[]);q.onerror=()=>res([])}catch(e){res([])}})}
function dbPut(s,v){if(!idb)return Promise.resolve(false);return new Promise(res=>{try{const t=idb.transaction(s,'readwrite');t.objectStore(s).put(v);t.oncomplete=()=>res(true);t.onerror=()=>res(false);t.onabort=()=>res(false)}catch(e){res(false)}})}
function dbDel(s,id){if(!idb)return Promise.resolve(false);return new Promise(res=>{try{const t=idb.transaction(s,'readwrite');t.objectStore(s).delete(id);t.oncomplete=()=>res(true);t.onerror=()=>res(false);t.onabort=()=>res(false)}catch(e){res(false)}})}
function dbClear(s){if(!idb)return Promise.resolve(false);return new Promise(res=>{try{const t=idb.transaction(s,'readwrite');t.objectStore(s).clear();t.oncomplete=()=>res(true);t.onerror=()=>res(false);t.onabort=()=>res(false)}catch(e){res(false)}})}
const saveSettings=()=>dbPut('meta',Object.assign({id:'settings'},S.settings));
const savePerson=p=>dbPut('people',p);
async function persistAll(){
  for(const s of STORES)await dbClear(s);
  for(const p of S.products)await dbPut('products',p);
  for(const b of S.bills)await dbPut('bills',b);
  for(const x of S.ins)await dbPut('ins',x);
  for(const x of S.adjs)await dbPut('adjs',x);
  for(const x of S.pays)await dbPut('pays',x);
  for(const id of Object.keys(S.photos))await dbPut('photos',{id,data:S.photos[id]});
  for(const k of Object.keys(S.people))await dbPut('people',S.people[k]);
  await saveSettings();
}

/* ---------- derived data ---------- */
function status(p){
  const days=p.expiry?daysTo(p.expiry):null;
  return {out:p.qty<=0,low:p.qty>0&&p.qty<=p.min,days:days,expired:days!==null&&days<0,expSoon:days!==null&&days>=0&&days<=60};
}
function stats(){
  let value=0;const low=[],exp=[];
  for(const p of S.products){
    value+=p.qty*p.buy;const s=status(p);
    if(s.out||s.low)low.push(p);
    if(s.expired||s.expSoon)exp.push(p);
  }
  low.sort((a,b)=>a.qty-b.qty);exp.sort((a,b)=>daysTo(a.expiry)-daysTo(b.expiry));
  const todayBills=S.bills.filter(b=>isToday(b.ts));
  const todaySales=todayBills.reduce((a,b)=>a+b.total,0);
  const due=peopleList().reduce((a,p)=>a+(p.bal>0.5?p.bal:0),0);
  return {value,low,exp,todaySales,todayCount:todayBills.length,due};
}
function peopleList(){
  const m=new Map();
  const get=name=>{const k=pkey(name);if(!k)return null;if(!m.has(k))m.set(k,{key:k,name:String(name).trim(),phone:'',bal:0,last:0});return m.get(k)};
  Object.values(S.people).forEach(p=>{const o=get(p.name);if(o)o.phone=p.phone||''});
  S.bills.forEach(b=>{const o=get(b.party);if(o){o.bal+=b.total-b.paid;o.last=Math.max(o.last,b.ts)}});
  S.pays.forEach(y=>{const o=get(y.party);if(o){o.bal-=y.amount;o.last=Math.max(o.last,y.ts)}});
  m.forEach(o=>{o.bal=Math.round(o.bal*100)/100});
  return [...m.values()];
}

  S.ins.forEach(x=>a.push({ts:x.ts,k:'in',o:x}));
  S.adjs.forEach(x=>a.push({ts:x.ts,k:'adj',o:x}));
  S.pays.forEach(x=>a.push({ts:x.ts,k:'pay',o:x}));
  return a.sort((x,y)=>y.ts-x.ts);
}

async function shareText(text,title){
  try{if(navigator.share){await navigator.share({title:title||S.settings.shop,text});return}}catch(e){if(e&&e.name==='AbortError')return}
  try{await navigator.clipboard.writeText(text);toast(tx('copied'));return}catch(e){}
  sheet('<h3>'+L('shareBill')+'</h3><p class="note">'+L('copyText')+'</p><textarea readonly rows="10" onfocus="this.select()">'+esc(text)+'</textarea>');

async function saveFile(filename,data){
  try{
    const d=(typeof claude!=='undefined'&&claude.use)?await claude.use('downloads'):null;
    if(d){await d.save({filename,data});return true}
  }catch(e){if(e&&e.code==='declined')return false}
  try{
    const b=new Blob([data],{type:'application/octet-stream'});const a=document.createElement('a');
    a.href=URL.createObjectURL(b);a.download=filename;document.body.appendChild(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(a.href),4000);return true;
  }catch(e){toast(tx('cantSave'));return false}
}

function filteredProducts(){
  let a=S.products.slice();const q=S.q.trim().toLowerCase();
  if(q)a=a.filter(p=>[p.name,p.name2,p.brand,p.supplier,p.rack,p.batch].join(' ').toLowerCase().indexOf(q)>=0);
  if(S.cat!=='all')a=a.filter(p=>p.cat===S.cat);
  if(S.filter==='low')a=a.filter(p=>{const s=status(p);return s.out||s.low});
  else if(S.filter==='out')a=a.filter(p=>p.qty<=0);
  else if(S.filter==='exp')a=a.filter(p=>{const s=status(p);return s.expired||s.expSoon});
  if(S.sort==='name')a.sort((x,y)=>x.name.localeCompare(y.name,'hi'));
  else if(S.sort==='low')a.sort((x,y)=>(x.qty-x.min)-(y.qty-y.min));
  else a.sort((x,y)=>(y.updated||0)-(x.updated||0));
  return a;
}

function prodHistory(pid){
  const a=[];
  S.bills.forEach(b=>b.items.forEach(i=>{if(i.pid===pid)a.push({ts:b.ts,t:tx('sold'),q:-i.qty,u:i.unit,s:b.party||tx('walkin')})}));
  S.ins.forEach(x=>{if(x.pid===pid)a.push({ts:x.ts,t:tx('received'),q:x.qty,u:x.unit,s:x.supplier||''})});
  S.adjs.forEach(x=>{if(x.pid===pid)a.push({ts:x.ts,t:tx('adjusted'),q:x.delta,u:x.unit,s:x.reason||''})});
  return a.sort((x,y)=>y.ts-x.ts).slice(0,8);
}

function resizeImage(file,max,q){return new Promise(res=>{
  try{const fr=new FileReader();fr.onerror=()=>res(null);fr.onload=()=>{const im=new Image();im.onerror=()=>res(null);im.onload=()=>{
    try{const M=max||720;let w=im.width,h=im.height;const k=Math.min(1,M/Math.max(w,h));w=Math.round(w*k);h=Math.round(h*k);
      const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(im,0,0,w,h);res(c.toDataURL('image/jpeg',q||0.72))}catch(e){res(null)}};im.src=fr.result};fr.readAsDataURL(file)}catch(e){res(null)}
})}
async function saveProduct(id){
  const g=i=>$('#'+i).value;const name=g('f-name').trim();
  if(!name){toast(tx('needNameP'));$('#f-name').focus();return}
  const old=id?prod(id):null;
  const p=old||{id:uid(),created:Date.now(),qty:0};
  const newQty=n0(g('f-qty'));
  if(old&&Math.abs(newQty-old.qty)>1e-9){
    const adj={id:uid(),ts:Date.now(),pid:p.id,name:old.name,unit:g('f-unit'),delta:Math.round((newQty-old.qty)*1000)/1000,reason:'Stock edit'};
    S.adjs.push(adj);await dbPut('adjs',adj);
  }
  Object.assign(p,{name,name2:g('f-name2').trim(),cat:g('f-cat'),brand:g('f-brand').trim(),unit:g('f-unit'),qty:newQty,min:n0(g('f-min')),buy:n0(g('f-buy')),sell:n0(g('f-sell')),batch:g('f-batch').trim(),expiry:g('f-exp'),supplier:g('f-sup').trim(),rack:g('f-rack').trim(),note:g('f-note').trim(),ingredient:g('f-ing').trim(),usage:g('f-use').trim(),updated:Date.now()});
  if(!old){S.products.push(p);if(newQty>0){const x={id:uid(),ts:Date.now(),pid:p.id,name:p.name,unit:p.unit,qty:newQty,rate:p.buy,supplier:p.supplier,batch:p.batch,expiry:p.expiry,note:'Opening stock'};S.ins.push(x);await dbPut('ins',x)}}
  await dbPut('products',p);
  if(pendingPhoto==='remove'){delete S.photos[p.id];await dbDel('photos',p.id)}
  else if(pendingPhoto){S.photos[p.id]=pendingPhoto;await dbPut('photos',{id:p.id,data:pendingPhoto})}
  pendingPhoto=null;closeSheet();render();toast(tx('productSaved'));
}
function deleteProduct(id){

    S.products=S.products.filter(p=>p.id!==id);delete S.photos[id];

function cartTotal(){return cart.reduce((a,l)=>a+l.qty*l.rate,0)}
function drawCart(){
  const el=$('#s-cart');if(!el)return;
  el.innerHTML=cart.map((l,i)=>{const p=prod(l.pid);if(!p)return '';
    return '<div class="line" data-i="'+i+'"><div class="line-top"><b>'+esc(pname(p))+'</b><button data-act="cart-del" data-i="'+i+'" aria-label="'+esc(tx('del'))+'">'+ic('x')+'</button></div>'+
      '<div class="line-row"><div><label>'+L('qty')+' ('+esc(unitName(p.unit))+')</label><input class="cq" type="number" step="any" inputmode="decimal" value="'+l.qty+'"></div>'+
      '<div><label>'+L('rate')+'</label><input class="cr" type="number" step="any" inputmode="decimal" value="'+l.rate+'"></div><div class="lt">'+inr(l.qty*l.rate)+'</div></div>'+
      '<div class="note" style="margin:4px 0 0">'+esc(tx('available'))+': '+num(p.qty)+' '+esc(unitName(p.unit))+'</div></div>'}).join('');
  el.querySelectorAll('.line').forEach(row=>{
    const i=+row.dataset.i;
    const upd=()=>{cart[i].qty=n0($('.cq',row).value);cart[i].rate=n0($('.cr',row).value);$('.lt',row).textContent=inr(cart[i].qty*cart[i].rate);totals()};
    $('.cq',row).addEventListener('input',upd);$('.cr',row).addEventListener('input',upd);
  });
  totals();
}
function totals(){
  const t=cartTotal();const pe=$('#s-paid');if(!pe)return;
  if(!paidTouched)pe.value=t?String(Math.round(t*100)/100):'';
  const paid=Math.min(n0(pe.value),t);
  $('#s-tot').innerHTML='<div class="tot"><div class="grand"><span>'+L('total')+'</span><span>'+inr(t)+'</span></div><div><span>'+L('due')+'</span><b class="'+(t-paid>0.5?'neg':'')+'">'+inr(Math.max(0,t-paid))+'</b></div></div>';
}
async function saveSale(){
  if(!cart.length){toast(tx('needItems'));return}
  for(const l of cart){const p=prod(l.pid);if(!p||l.qty<=0){toast(tx('needItems'));return}if(l.qty>p.qty+1e-9){toast(tx('notEnough')+': '+p.name);return}}
  const party=$('#s-party').value.trim();const total=Math.round(cartTotal()*100)/100;
  const paid=Math.min(Math.round(n0($('#s-paid').value)*100)/100,total);
  if(total-paid>0.5&&!party){toast(tx('needName'));$('#s-party').focus();return}
  const bill={id:uid(),ts:Date.now(),party,total,paid,items:cart.map(l=>{const p=prod(l.pid);return {pid:p.id,name:pname(p),unit:p.unit,qty:l.qty,rate:l.rate,cost:p.buy}})};
  for(const l of cart){const p=prod(l.pid);p.qty=Math.round((p.qty-l.qty)*1000)/1000;p.updated=Date.now();await dbPut('products',p)}
  S.bills.push(bill);await dbPut('bills',bill);
  if(party&&!S.people[pkey(party)]){const pp={id:pkey(party),name:party,phone:''};S.people[pp.id]=pp;await savePerson(pp)}
  closeSheet();render();toast(tx('billSaved'),{label:tx('shareBill'),fn:()=>shareText(billText(bill))});
}
function billText(b){
  const s=S.settings;const lines=[s.shop,(s.addr?s.addr:''),(s.owner?tx('owner')+': '+s.owner:''),(s.phone?'☎ '+s.phone:''),'',tx('bill')+': '+fmtDate(b.ts)+' '+fmtTime(b.ts),(b.party?tx('customer')+': '+b.party:''),'--------------'];
  b.items.forEach((i,n)=>lines.push((n+1)+'. '+i.name+'\n   '+num(i.qty)+' '+unitName(i.unit)+' x '+inr(i.rate)+' = '+inr(i.qty*i.rate)));
  lines.push('--------------',tx('total')+': '+inr(b.total),tx('paid')+': '+inr(b.paid));
  if(b.total-b.paid>0.5)lines.push(tx('due')+': '+inr(b.total-b.paid));
  lines.push('','धन्यवाद / Thank you 🙏');
  return lines.filter((x,i)=>x!==''||lines[i-1]!=='').join('\n');
}

const AI={ok:false,img:false,max:1,fn:null};
let aiCtl=null;
async function initAI(){
  try{
    if(typeof claude==='undefined'||!claude.use)return;
    const f=await claude.use('sample');if(!f)return;
    let lim=null;try{lim=await f.limits()}catch(e){}
    AI.fn=f;AI.ok=true;AI.img=!!(lim&&lim.images);AI.max=(lim&&lim.images&&lim.images.maxCount)||1;
    render();

}
function newCtl(){if(aiCtl)aiCtl.abort();aiCtl=new AbortController();return aiCtl}
function dataToBlob(d){const parts=d.split(',');const mime=(parts[0].match(/:(.*?);/)||[])[1]||'image/jpeg';const bin=atob(parts[1]);const u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);return new Blob([u],{type:mime})}

function aiErr(e){const c=e&&e.code;return c==='not_granted'?tx('aiDenied'):c==='rate_limited'?tx('aiBusy'):c==='images_unavailable'?tx('aiNA'):tx('aiFail')}
const LANGP=()=>lang()==='en'?'simple English':'simple Hindi in Devanagari that a village farmer understands (keep product and chemical names also in English letters)';

function applyLabel(r){
  if(!r||typeof r!=='object')return false;
  const set=(id,v,force)=>{const el=$('#'+id);if(!el||v==null)return;v=String(v).trim();if(!v)return;if(force||!el.value.trim()){el.value=v;el.dispatchEvent(new Event('input'))}};
  set('f-name',r.name);set('f-name2',r.name2);set('f-brand',r.brand);
  if(!formPid){if(C[r.category])$('#f-cat').value=r.category;if(U[r.unit])$('#f-unit').value=r.unit}
  if(n0(r.mrp)>0)set('f-sell',n0(r.mrp));
  set('f-batch',r.batch);
  if(/^\d{4}-\d{2}-\d{2}$/.test(String(r.expiry||'')))set('f-exp',r.expiry);
  set('f-ing',r.ingredient);set('f-use',r.usage);
  return true;
}

  const crop=($('#lf-crop')||{value:''}).value.trim(),note=($('#lf-note')||{value:''}).value.trim();
  try{
    const r=await AI.fn.json(leafPrompt(crop,note),{images:leafImgs.map(dataToBlob),signal:ctl.signal});
    const o2=$('#lf-out');if(o2)o2.innerHTML=leafResultHTML(r);
  }catch(e){const o2=$('#lf-out');if(o2)o2.innerHTML=(e&&e.code==='cancelled')?'':'<p class="note neg"><b>'+esc(aiErr(e))+'</b></p>'}
}

/* ---------- actions ---------- */
const ACT={
  go:el=>go(el.dataset.v),
  'go-stock':el=>{S.filter=el.dataset.f;S.cat='all';S.q='';go('stock',true)},
  cat:el=>{S.cat=el.dataset.c;render()},
  hf:el=>{S.hf=el.dataset.k;render()},
  rp:el=>{S.rp=el.dataset.k;render()},
  'kh-all':()=>{S.khAll=!S.khAll;render()},
  close:()=>closeSheet(),
  'close-bd':(el,e)=>{if(e.target===el)closeSheet()},
  'dlg-no':()=>closeDlg(),
  'dlg-yes':()=>{const f=confirmBox.fn;closeDlg();if(f)f()},
  'toast-act':()=>{const f=toast.fn;$('#toast').innerHTML='';if(f)f()},
  'set-lang':el=>{S.settings.lang=el.dataset.l;saveSettings();render()},
  'open-product':el=>openProduct(el.dataset.id),
  'add-product':()=>openProductForm(),
  'edit-product':el=>openProductForm(el.dataset.id),
  'del-product':el=>deleteProduct(el.dataset.id),
  'save-product':el=>saveProduct(el.dataset.id||''),
  'rm-photo':()=>{pendingPhoto='remove';$('#ph-prev').innerHTML='📷'},
  'ai-scan':()=>scanLabel(),
  'ai-stop':()=>{if(aiCtl)aiCtl.abort()},
  'ai-usage':el=>askUsage(el.dataset.id),
  leaf:()=>openLeaf(),
  'leaf-go':()=>leafRun(),
  'lf-del':el=>{leafImgs.splice(+el.dataset.i,1);drawLeafThumbs()},
  sale:()=>openSale(),
  'sale-with':el=>openSale(el.dataset.id),
  'cart-add':el=>{const p=prod(el.dataset.id);if(!p)return;const ex=cart.find(l=>l.pid===p.id);if(ex)ex.qty+=1;else cart.push({pid:p.id,qty:1,rate:p.sell});$('#s-q').value='';$('#s-res').innerHTML='';drawCart()},
  'cart-del':el=>{cart.splice(+el.dataset.i,1);drawCart()},
  'save-sale':()=>saveSale(),
  'stock-in':()=>openIn(),
  'in-with':el=>openIn(el.dataset.id),
  'in-pick':el=>{inSel=el.dataset.id;$('#i-q').value='';$('#i-res').innerHTML='';drawIn()},
  'save-in':()=>saveIn(),
  'open-cust':el=>openCust(el.dataset.k),
  receive:el=>openReceive(el.dataset.k),
  'r-full':el=>{$('#r-amt').value=el.dataset.v},
  'save-recv':el=>saveRecv(el.dataset.k),
  'new-account':()=>openNewAccount(),
  'save-account':()=>saveAccount(),
  'share-remind':el=>{const c=peopleList().find(p=>p.key===el.dataset.k);if(c)shareText(custMsg(c))},
  'open-feed':(el)=>openFeed(el.dataset.k,el.dataset.id),
  'del-feed':el=>deleteFeed(el.dataset.k,el.dataset.id),
  'share-bill':el=>{const b=S.bills.find(x=>x.id===el.dataset.id);if(b)shareText(billText(b))},
  'share-reorder':()=>{const low=stats().low;shareText(S.settings.shop+' - '+tx('reorder')+' ('+fmtDate(Date.now())+')\n\n'+low.map((p,i)=>(i+1)+'. '+pname(p)+' - '+tx('inStock')+': '+num(p.qty)+' '+unitName(p.unit)).join('\n'),tx('reorder'))},
  backup:()=>saveFile('chandrakala-backup-'+ymdToday()+'.json',JSON.stringify(backupObj())),
  'export-csv':()=>exportCsv(),
  sample:()=>loadSample(),
  wipe:()=>confirmBox('askWipe','del',async()=>{
    Object.assign(S,{products:[],bills:[],ins:[],adjs:[],pays:[],photos:{},people:{}});await persistAll();render();toast(tx('deleted'));
  },true)
};
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]');if(!el)return;
  const f=ACT[el.dataset.act];if(f)f(el,e);
});
$('#btn-lang').addEventListener('click',()=>{
  const order=['both','hi','en'];S.settings.lang=order[(order.indexOf(S.settings.lang)+1)%3];saveSettings();render();
});

/* ---------- start ---------- */
async function init(){
  render();
  idb=await openDB();S.persist=!!idb;
  try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){}
  if(idb){
    const r=await Promise.all(STORES.map(dbAll));
    S.products=r[0];S.bills=r[1];S.ins=r[2];S.adjs=r[3];S.pays=r[4];
    r[5].forEach(x=>{S.photos[x.id]=x.data});r[6].forEach(x=>{S.people[x.id]=x});
    const st=r[7].find(m=>m.id==='settings');if(st){delete st.id;Object.assign(S.settings,st)}
    if(!S.settings.owner)S.settings.owner='सचिन मर्सकोले';
    if(!S.settings.phone)S.settings.phone='+917692859935';
  }
  render();
}
init();
try{if('serviceWorker' in navigator&&/^https?:/.test(location.protocol))navigator.serviceWorker.register('sw.js')}catch(e){}
})();
</script>
</body>
</html>
